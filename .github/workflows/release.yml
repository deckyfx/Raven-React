# Builds Raven for every platform, tests raven-tsx on each, compiles the example, and on a
# version tag publishes one npm package per platform and the main package that lists them.
#
# Every run makes all the packages and rehearses with npm pack --dry-run. Publishing is off until
# the repository variable NPM_PUBLISH is set to "true", and then happens on a version tag, in the
# environment "npm". A package with a trusted publisher on npm needs no secret. One that has none
# yet, which npm requires for its first version, needs the secret NPM_TOKEN, with the right to
# publish in the @decky.fx scope.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu available: a library built here runs on newer glibc, not older
          - { target: linux-x64, os: ubuntu-22.04, library: build/libraven.so, test: true }
          - { target: linux-arm64, os: ubuntu-22.04-arm, library: build/libraven.so, test: true }
          # macos-14 was retired by GitHub (2026-11-02). The target stays 14.0, what the libraries built
          # there asked for: without it, a library built on macos-15 would not load on older systems
          - { target: darwin-arm64, os: macos-15, library: build/libraven.dylib, cmake: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0", test: true }
          # built on Apple Silicon for Intel, so it cannot run here
          - { target: darwin-x64, os: macos-15, library: build/libraven.dylib, cmake: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0", test: false }
          # the C runtime inside the DLL, so that nothing needs installing with it
          - { target: win32-x64, os: windows-latest, library: build/bin/Release/raven.dll, cmake: "-A x64 -DRAVEN_MSVC_STATIC_RUNTIME=ON", test: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the version of Raven
        # (a full commit or a tag; on Windows the line can end in a carriage return)
        run: echo "RAVEN_REF=$(tr -d '\r\n' < packages/raven-tsx/RAVEN_VERSION)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: oscar-soirey/Raven
          ref: ${{ env.RAVEN_REF }}
          path: raven-source

      - name: Install the X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Build Raven
        working-directory: raven-source
        run: |
          cmake -S . -B build ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAVEN_BUILD_SHARED=ON \
            -DRAVEN_BUILD_TESTS=OFF \
            -DRAVEN_BUILD_EXAMPLES=OFF \
            -DRAVEN_BUILD_TOOLS=OFF
          cmake --build build --config Release --parallel

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # built here for another processor, this one does not run on the machine: raven:check says
      # less about it. native:local refuses a library that is not of the pinned commit.
      - name: Package the library of this platform
        if: matrix.test
        working-directory: packages/raven-tsx
        run: bun run native:local --raven-build ../../raven-source/build

      - name: Install
        run: bun install

      - name: Check that everything agrees with RAVEN_VERSION, and the types
        working-directory: packages/raven-tsx
        run: |
          bun run raven:check --raven ../../raven-source ${{ !matrix.test && '--no-library' || '' }}
          bun run sync-binding --raven ../../raven-source --check
          bun run typecheck

      - name: Test
        if: matrix.test
        working-directory: packages/raven-tsx
        env:
          RAVEN_LIBRARY: ${{ github.workspace }}/raven-source/${{ matrix.library }}
          RAVEN_CHECKOUT: ${{ github.workspace }}/raven-source
        run: bun test

      - name: Compile the example
        if: matrix.test
        run: |
          cd examples/helloworld
          bun run typecheck
          bun run ./build.ts

      - name: Make the package of this platform
        working-directory: packages/raven-tsx
        run: |
          bun run pack:platform --target ${{ matrix.target }} --lib "../../raven-source/${{ matrix.library }}" --raven ../../raven-source --out ../../dist/npm

      # the packages as npm gives them, in an application that compiles our sources with its strict
      # settings (skipLibCheck does not skip a .ts file), and loads the library of this platform
      - name: Install the packages into an application, and compile it strictly
        if: matrix.test
        working-directory: packages/raven-tsx
        run: bun run check:consumer --platform ../../dist/npm/${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/${{ matrix.target }}
          if-no-files-found: error

  # no id-token here: these steps run the code of the branch, and its dependencies
  package:
    name: package
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The tag must be the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p 'require("./packages/raven-tsx/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # (no cache in a release: setup-node caches npm's by itself from v5)
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: dist/artifacts

      - name: Make the main package
        run: |
          bun install
          cd packages/raven-tsx
          bun run prepare:publish --out ../../dist/npm

      # (packing and not npm publish --dry-run: npm refuses even a dry run of a version it already has)
      - name: Rehearse
        run: |
          for directory in dist/artifacts/npm-* dist/npm/main; do
            (cd "$directory" && npm pack --dry-run)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: main-package
          path: dist/npm/main
          if-no-files-found: error

  # only what the jobs above made is published: nothing of the repository runs where the token and
  # the right to ask for an OIDC token are
  publish:
    name: publish
    if: vars.NPM_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          # (trusted publishing needs npm 11.5.1 or newer: the npm of Node 22 is 10)
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          path: dist/artifacts

      # the platforms first: the main package depends on them. npm tries the trusted publisher
      # first and falls back on the token
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for directory in dist/artifacts/npm-* dist/artifacts/main-package; do
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>view.log; then
              echo "$name@$version is already published"
            elif grep -q E404 view.log; then
              (cd "$directory" && npm publish --access public --provenance)
            else
              # (the registry did not answer: that says nothing about this version)
              cat view.log
              exit 1
            fi
          done
